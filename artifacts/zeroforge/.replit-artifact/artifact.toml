kind = "web"
previewPath = "/"
title = "ZeroForge"
version = "1.0.0"
id = "artifacts/zeroforge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18754

[services.development]
run = "pnpm --filter @workspace/zeroforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zeroforge", "run", "build" ]
publicDir = "artifacts/zeroforge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18754"
BASE_PATH = "/"
