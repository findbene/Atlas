          type: boolean
        nextStepId:
          type: string
        projectComplete:
          type: boolean
        stdout:
          type: string
        stderr:
          type: string
        executionTimeMs:
          type: integer
      required:
        - status
        - feedback
        - xpEarned
        - attempt

    CheckResult:
      type: object
      description: |
        Phase 24 — Result of POST .../check. The omission of xpEarned,
        attempt, isFirstPass, and projectComplete is the on-the-wire
        contract that nothing was committed server-side.
      properties:
        status:
          type: string
          enum: [passed, failed]
        feedback:
