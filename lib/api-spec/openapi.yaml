openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ZeroForge API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: domains
    description: Learning domain operations
  - name: tracks
    description: Track operations
  - name: projects
    description: Project operations
  - name: progress
    description: User progress operations
  - name: ai
    description: AI tutor operations
  - name: certificates
    description: Certificate operations
  - name: dashboard
    description: Dashboard operations
  - name: discussions
    description: Discussion operations
  - name: waitlist
    description: Waitlist operations
  - name: users
    description: User operations
  - name: code
    description: Code execution operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/sync:
    post:
      operationId: syncUser
      tags: [users]
      summary: Sync Clerk user to DB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUserBody"
      responses:
        "200":
          description: User synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /domains:
    get:
      operationId: listDomains
      tags: [domains]
      summary: List all learning domains
      responses:
        "200":
          description: List of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"

  /domains/{slug}:
    get:
      operationId: getDomain
      tags: [domains]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"

  /domains/{domainSlug}/tracks:
    get:
      operationId: listTracks
      tags: [tracks]
      parameters:
        - name: domainSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Track"

  /tracks/{trackSlug}/projects:
    get:
      operationId: listProjects
      tags: [projects]
      parameters:
        - name: trackSlug
          in: path
          required: true
          schema:
            type: string
        - name: domainSlug
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: tech
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectWithProgress"

  /projects/{projectSlug}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
        - name: trackSlug
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Project details with steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"

  /projects/{projectSlug}/steps:
    get:
      operationId: getProjectSteps
      tags: [projects]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectStep"

  /projects/{projectSlug}/hints:
    get:
      operationId: getProjectHints
      tags: [projects]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
        - name: stepNumber
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Project hints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectHint"

  /projects/{projectSlug}/solution:
    get:
      operationId: getProjectSolution
      tags: [projects]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project solution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSolution"

  /projects/{projectSlug}/notes:
    get:
      operationId: getProjectNotes
      tags: [projects]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project theory notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectNote"

  /progress/{projectSlug}:
    get:
      operationId: getProgress
      tags: [progress]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User progress for a project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"
    put:
      operationId: updateProgress
      tags: [progress]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgressBody"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"

  /progress/{projectSlug}/code:
    get:
      operationId: getCodeSession
      tags: [progress]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved code session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSession"
    put:
      operationId: saveCodeSession
      tags: [progress]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCodeBody"
      responses:
        "200":
          description: Code saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSession"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get user dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getActivityHeatmap
      tags: [dashboard]
      summary: Get activity data for heatmap
      responses:
        "200":
          description: Activity data by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  /dashboard/suggested:
    get:
      operationId: getSuggestedProjects
      tags: [dashboard]
      summary: Get suggested next projects
      responses:
        "200":
          description: Suggested projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectWithProgress"

  /ai/tutor:
    post:
      operationId: sendAITutorMessage
      tags: [ai]
      summary: Send message to AI tutor (streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AITutorMessageBody"
      responses:
        "200":
          description: AI tutor response (SSE stream)
          content:
            text/event-stream:
              schema:
                type: string

  /ai/usage:
    get:
      operationId: getAIUsage
      tags: [ai]
      summary: Get AI tutor usage for today
      responses:
        "200":
          description: AI usage count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIUsage"

  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: Get user's earned certificates
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"

  /certificates/{uid}:
    get:
      operationId: getCertificate
      tags: [certificates]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Certificate details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /discussions/{projectSlug}:
    get:
      operationId: listDiscussions
      tags: [discussions]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Discussion threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscussionThread"
    post:
      operationId: createDiscussion
      tags: [discussions]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiscussionBody"
      responses:
        "201":
          description: Thread created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionThread"

  /discussions/{projectSlug}/{threadId}/replies:
    get:
      operationId: listReplies
      tags: [discussions]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread replies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscussionReply"
    post:
      operationId: createReply
      tags: [discussions]
      parameters:
        - name: projectSlug
          in: path
          required: true
          schema:
            type: string
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplyBody"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscussionReply"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistBody"
      responses:
        "200":
          description: Added to waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"

  /code/execute:
    post:
      operationId: executeCode
      tags: [code]
      summary: Execute Python code via Piston API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteCodeBody"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteCodeResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        role:
          type: string
        subscriptionTier:
          type: string
        streakCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - clerkId
        - email
        - role
        - subscriptionTier
        - streakCount
        - createdAt

    SyncUserBody:
      type: object
      properties:
        clerkId:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - clerkId
        - email

    Domain:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        tagline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        iconName:
          type: string
          nullable: true
        colorHex:
          type: string
          nullable: true
        isAvailable:
          type: boolean
        comingSoon:
          type: boolean
        totalProjects:
          type: integer
        orderIndex:
          type: integer
      required:
        - id
        - slug
        - title
        - isAvailable
        - comingSoon
        - totalProjects
        - orderIndex

    Track:
      type: object
      properties:
        id:
          type: string
        domainId:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        difficultyLevel:
          type: string
        estimatedHours:
          type: integer
          nullable: true
        projectCount:
          type: integer
        orderIndex:
          type: integer
        isPremium:
          type: boolean
      required:
        - id
        - domainId
        - slug
        - title
        - difficultyLevel
        - projectCount
        - orderIndex
        - isPremium

    Project:
      type: object
      properties:
        id:
          type: string
        trackId:
          type: string
        domainId:
          type: string
        slug:
          type: string
        title:
          type: string
        shortDescription:
          type: string
        difficultyLevel:
          type: string
        estimatedMinutes:
          type: integer
        techStack:
          type: array
          items:
            type: string
        learningObjectives:
          type: array
          items:
            type: string
        orderIndex:
          type: integer
        isPremium:
          type: boolean
        language:
          type: string
        totalSteps:
          type: integer
        tags:
          type: array
          items:
            type: string
          nullable: true
        starterCode:
          type: string
          nullable: true
      required:
        - id
        - trackId
        - domainId
        - slug
        - title
        - shortDescription
        - difficultyLevel
        - estimatedMinutes
        - techStack
        - learningObjectives
        - orderIndex
        - isPremium
        - language
        - totalSteps

    ProjectWithProgress:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            progress:
              $ref: "#/components/schemas/UserProgress"
              nullable: true

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            fullDescription:
              type: string
            steps:
              type: array
              items:
                $ref: "#/components/schemas/ProjectStep"
            progress:
              $ref: "#/components/schemas/UserProgress"
              nullable: true
          required:
            - fullDescription
            - steps

    ProjectStep:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        stepNumber:
          type: integer
        title:
          type: string
        instructionMd:
          type: string
        codeContext:
          type: string
          nullable: true
        expectedOutput:
          type: string
          nullable: true
        validationHint:
          type: string
          nullable: true
      required:
        - id
        - projectId
        - stepNumber
        - title
        - instructionMd

    ProjectHint:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        stepNumber:
          type: integer
          nullable: true
        hintLevel:
          type: integer
        hintText:
          type: string
      required:
        - id
        - projectId
        - hintLevel
        - hintText

    ProjectSolution:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        solutionCode:
          type: string
        solutionExplanationMd:
          type: string
        videoExplanationUrl:
          type: string
          nullable: true
      required:
        - id
        - projectId
        - solutionCode
        - solutionExplanationMd

    ProjectNote:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        contentMd:
          type: string
        noteType:
          type: string
        videoUrl:
          type: string
          nullable: true
        orderIndex:
          type: integer
      required:
        - id
        - title
        - contentMd
        - noteType
        - orderIndex

    UserProgress:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        projectId:
          type: string
        status:
          type: string
        currentStep:
          type: integer
        learningMode:
          type: string
        revealedAnswer:
          type: boolean
        hintsUsed:
          type: integer
        completionPercent:
          type: integer
        startedAt:
          type: string
          nullable: true
        completedAt:
          type: string
          nullable: true
        lastUpdatedAt:
          type: string
      required:
        - id
        - userId
        - projectId
        - status
        - currentStep
        - learningMode
        - revealedAnswer
        - hintsUsed
        - completionPercent
        - lastUpdatedAt

    UpdateProgressBody:
      type: object
      properties:
        status:
          type: string
        currentStep:
          type: integer
        learningMode:
          type: string
        revealedAnswer:
          type: boolean
        hintsUsed:
          type: integer
        completionPercent:
          type: integer

    CodeSession:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        projectId:
          type: string
        codeContent:
          type: string
          nullable: true
        sqlContent:
          type: string
          nullable: true
        language:
          type: string
        savedAt:
          type: string
      required:
        - id
        - userId
        - projectId
        - language
        - savedAt

    SaveCodeBody:
      type: object
      properties:
        codeContent:
          type: string
          nullable: true
        sqlContent:
          type: string
          nullable: true
        language:
          type: string

    DashboardStats:
      type: object
      properties:
        projectsCompleted:
          type: integer
        totalHoursCoded:
          type: number
        currentStreak:
          type: integer
        aiMessagesUsedToday:
          type: integer
        aiDailyLimit:
          type: integer
        inProgressProjects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectWithProgress"
        domainProgress:
          type: array
          items:
            $ref: "#/components/schemas/DomainProgress"
        recentCertificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
      required:
        - projectsCompleted
        - totalHoursCoded
        - currentStreak
        - aiMessagesUsedToday
        - aiDailyLimit
        - inProgressProjects
        - domainProgress
        - recentCertificates

    DomainProgress:
      type: object
      properties:
        domainSlug:
          type: string
        domainTitle:
          type: string
        completedProjects:
          type: integer
        totalProjects:
          type: integer
        completionPercent:
          type: integer
      required:
        - domainSlug
        - domainTitle
        - completedProjects
        - totalProjects
        - completionPercent

    ActivityEntry:
      type: object
      properties:
        date:
          type: string
        count:
          type: integer
      required:
        - date
        - count

    AITutorMessageBody:
      type: object
      properties:
        projectId:
          type: string
        currentStep:
          type: integer
        learningMode:
          type: string
        userCode:
          type: string
        conversationHistory:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        userMessage:
          type: string
      required:
        - projectId
        - currentStep
        - learningMode
        - userCode
        - conversationHistory
        - userMessage

    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
      required:
        - role
        - content

    AIUsage:
      type: object
      properties:
        messagesUsedToday:
          type: integer
        dailyLimit:
          type: integer
        isPro:
          type: boolean
      required:
        - messagesUsedToday
        - dailyLimit
        - isPro

    Certificate:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        certificateUid:
          type: string
        recipientName:
          type: string
        title:
          type: string
        shareUrl:
          type: string
          nullable: true
        issuedAt:
          type: string
        domainTitle:
          type: string
          nullable: true
        trackTitle:
          type: string
          nullable: true
      required:
        - id
        - userId
        - certificateUid
        - recipientName
        - title
        - issuedAt

    DiscussionThread:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        userId:
          type: string
        title:
          type: string
        contentMd:
          type: string
        isPinned:
          type: boolean
        replyCount:
          type: integer
        createdAt:
          type: string
        authorName:
          type: string
          nullable: true
        authorAvatar:
          type: string
          nullable: true
      required:
        - id
        - projectId
        - userId
        - title
        - contentMd
        - isPinned
        - replyCount
        - createdAt

    CreateDiscussionBody:
      type: object
      properties:
        title:
          type: string
        contentMd:
          type: string
      required:
        - title
        - contentMd

    DiscussionReply:
      type: object
      properties:
        id:
          type: string
        threadId:
          type: string
        userId:
          type: string
        contentMd:
          type: string
        createdAt:
          type: string
        authorName:
          type: string
          nullable: true
        authorAvatar:
          type: string
          nullable: true
      required:
        - id
        - threadId
        - userId
        - contentMd
        - createdAt

    CreateReplyBody:
      type: object
      properties:
        contentMd:
          type: string
      required:
        - contentMd

    JoinWaitlistBody:
      type: object
      properties:
        email:
          type: string
        domainInterest:
          type: string
          nullable: true
      required:
        - email

    WaitlistEntry:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        domainInterest:
          type: string
          nullable: true
        signedUpAt:
          type: string
      required:
        - id
        - email
        - signedUpAt

    ExecuteCodeBody:
      type: object
      properties:
        code:
          type: string
        language:
          type: string
        stdin:
          type: string
          nullable: true
      required:
        - code
        - language

    ExecuteCodeResult:
      type: object
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exitCode:
          type: integer
        executionTime:
          type: number
      required:
        - stdout
        - stderr
        - exitCode
        - executionTime
