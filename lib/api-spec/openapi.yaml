openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Atlas - Project-based technical learning platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: domains
    description: Learning domain operations (INTERNAL — legacy grouping; learner-facing taxonomy is `courses`)
  - name: courses
    description: Atlas 9-course learner-facing taxonomy (source of truth = `projects.course`)
  - name: projects
    description: Project catalog operations
  - name: user-projects
    description: User project enrollment and progress
  - name: steps
    description: Project step and grading operations
  - name: modules
    description: Learning module operations
  - name: lessons
    description: Lesson operations
  - name: ai-tutor
    description: AI tutor chat operations
  - name: billing
    description: Stripe billing and subscription operations
  - name: webhooks
    description: Webhook endpoints
  - name: waitlist
    description: Coming-soon domain waitlist signups
  - name: users
    description: User profile operations
  - name: leaderboard
    description: Leaderboard and progress statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /domains:
    get:
      operationId: listDomains
      tags: [domains]
      summary: List all learning domains
      responses:
        "200":
          description: List of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"

  /domains/{slug}:
    get:
      operationId: getDomain
      tags: [domains]
      summary: Get domain details with project summary
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Domain detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainDetail"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all 9 Atlas courses (learner-facing taxonomy)
      description: |
        Returns the 9 Atlas courses with project counts aggregated from
        `projects.course`. This is the source of truth for the learner-facing
        catalog — do not use `/domains` for learner UI.
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  /courses/{slug}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get course details with project list
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum:
              - data-engineering
              - ai-engineer
              - mlops-engineer
              - data-scientist
              - analytics-engineer
              - applied-llm-engineer
              - cloud-data-engineer
              - python-libraries
              - sql
        - name: difficulty
          in: query
          required: false
          description: |
            Phase 16 — Optional learner-facing difficulty filter. Composes with
            the always-on `learner_visible=true` filter; hidden rows never leak.
            Invalid values return 400. Omit to return all difficulties.
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          description: Invalid difficulty filter value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects with optional filters
      parameters:
        - name: domainSlug
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced, expert]
        - name: tier
          in: query
          schema:
            type: string
            enum: [free, pro]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProjects"

  /projects/{slug}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project details including steps
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail with steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/projects:
    get:
      operationId: listUserProjects
      tags: [user-projects]
      summary: List authenticated user's enrolled projects
      security:
        - clerkAuth: []
      responses:
        "200":
          description: User's project enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProjectSummary"

  /user/projects/{projectId}/enroll:
    post:
      operationId: enrollProject
      tags: [user-projects]
      summary: Enroll in a project
      security:
        - clerkAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enrollment created or existing enrollment returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProject"
        "403":
          description: Project requires Pro subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/projects/{projectId}/progress:
    get:
      operationId: getUserProjectProgress
      tags: [user-projects]
      summary: Get detailed progress for a user project
      security:
        - clerkAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User project progress with step completions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProjectProgress"

  /runs/sign:
    post:
      operationId: signRun
      tags: [runs]
      summary: Sign a runtime capture as a server-issued RunResult envelope
      description: |
        Phase 46 — Mints a `SignedRunEnvelope` for a learner's runtime
        capture so the envelope can be attached to a later /submit call.
        Auth + ownership + visibility + premium + enrollment + signable-kind
        gates apply. Returns 422 for validation kinds that are not signable
        (e.g. self_attest, exact, regex, contains) so the client can fall
        back to a bare-string submission.
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignRunBody"
      responses:
        "200":
          description: Envelope signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignRunResponse"
        "400":
          description: Invalid request body or capture shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not enrolled OR premium step without Pro subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Step or project not found (or hidden)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Capture payload exceeds server-side size caps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation kind is not signable (client should fall back to bare-string submit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Signing secret unavailable (operator misconfig — client falls back)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/projects/{projectId}/steps/{stepId}/submit:
    post:
      operationId: submitStep
      tags: [steps]
      summary: Submit a step for grading
      security:
        - clerkAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitStepBody"
      responses:
        "200":
          description: Grading result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradingResult"
        "404":
          description: Step not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/projects/{projectId}/steps/{stepId}/check:
    post:
      operationId: checkStep
      tags: [steps]
      summary: Grade a step submission WITHOUT committing (no XP, no progress, no completion)
      description: |
        Phase 24 — Low-stakes Check. Uses the SAME server-side grading
        rules as /submit but performs zero side effects: no DB writes,
        no attempt counter, no XP, no streak, no progress mutation, no
        project completion, no completion email. The CheckResult shape
        intentionally omits xpEarned, attempt, isFirstPass, and
        projectComplete as the contract guarantee that nothing was
        committed.
      security:
        - clerkAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitStepBody"
      responses:
        "200":
          description: Provisional grading result (not committed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "403":
          description: Not enrolled in this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Step not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/projects/{projectId}/steps/{stepId}/hint:
    post:
      operationId: requestStepHint
      tags: [steps]
      summary: Request a hint for a step
      security:
        - clerkAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: stepId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HintRequestBody"
      responses:
        "200":
          description: AI-generated hint (streaming SSE)
          content:
            text/event-stream:
              schema:
                type: string

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List learning modules
      parameters:
        - name: domainSlug
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [python_mastery, sql_mastery, concepts]
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /modules/{moduleId}:
    get:
      operationId: getModule
      tags: [modules]
      summary: Get module with lessons
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Module detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDetail"

  /user/modules/{moduleId}/lessons/{lessonId}/complete:
    post:
      operationId: completeLesson
      tags: [lessons]
      summary: Mark a lesson as complete
      security:
        - clerkAuth: []
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
        - name: lessonId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson completion recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonCompletion"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai-tutor]
      summary: Stream AI tutor response (SSE)
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatBody"
      responses:
        "200":
          description: Streaming AI response
          content:
            text/event-stream:
              schema:
                type: string
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/chat/history:
    get:
      operationId: getAiChatHistory
      tags: [ai-tutor]
      summary: Get AI chat history for a context
      security:
        - clerkAuth: []
      parameters:
        - name: contextType
          in: query
          required: true
          schema:
            type: string
            enum: [project, module, general]
        - name: contextId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiChatMessage"

  /billing/plans:
    get:
      operationId: listBillingPlans
      tags: [billing]
      summary: List available subscription plans
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingPlan"

  /billing/subscription:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Get user's current subscription
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Create a Stripe checkout session
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutBody"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe billing portal session
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalResponse"

  /waitlist:
    post:
      operationId: joinWaitlist
      tags: [waitlist]
      summary: Join the waitlist for a coming-soon domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinWaitlistBody"
      responses:
        "200":
          description: Successfully joined or already on the waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinWaitlistResponse"

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [webhooks]
      summary: Stripe webhook handler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"

  /user/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get authenticated user's profile
      security:
        - clerkAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateUserProfile
      tags: [users]
      summary: Update user profile
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /user/stats:
    get:
      operationId: getUserStats
      tags: [users]
      summary: Get user learning statistics and XP
      security:
        - clerkAuth: []
      responses:
        "200":
          description: User statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get global XP leaderboard
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [all_time, monthly, weekly]
            default: all_time
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /execute/python:
    post:
      operationId: executePython
      tags: [steps]
      summary: Execute Python code via Piston API
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteCodeBody"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteCodeResult"

  /enrollments:
    post:
      operationId: createEnrollment
      tags: [user-projects]
      summary: Enroll in a project by slug (Phase 21)
      description: |
        Phase 21 — Slug-based idempotent enrollment overlay for the onboarding
        and Start Here flows. Resolves `projectSlug` → projectId, enforces
        `learner_visible=true` (hidden/archived slugs return 404 with no
        existence leak), and creates a `user_progress` row only if one does
        not already exist for `(userId, projectId)`. Repeated calls are safe:
        same response, no duplicate rows.
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentRequest"
      responses:
        "200":
          description: Enrollment created or existing enrollment returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Project requires Pro subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found or hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [user-projects]
      summary: Learner dashboard payload (Phase 21)
      description: |
        Phase 21 — Single-call learner dashboard: resume card, in-progress
        and completed enrollments, plus an optional Start Here recommendation
        for first-time learners. Hidden/archived projects are excluded
        symmetrically with `GET /api/courses/:slug`.
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  /onboarding/state:
    get:
      operationId: getOnboardingState
      tags: [user-projects]
      summary: Get learner onboarding state (Phase 21)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"

  /verify/{certId}:
    get:
      operationId: verifyCertificate
      tags: [user-projects]
      summary: Public certificate verification (Phase 28)
      description: |
        Phase 28 — Public, unauthenticated certificate verification. Anyone
        with the `certId` (the `user_progress.id` UUID of a completed
        project) can confirm authenticity and view an evidence summary
        derived from the Phase 26/27 trustworthy completion model
        (step-level passed counts, evidence-hash counts, and project-scoped
        XP ledger rollup).

        Privacy contract: never returns `email`, `clerkId`, internal user
        IDs, Stripe identifiers, raw `submissionExcerpt`, raw submission
        content, raw per-step `submissionSha256` values, or data from any
        project other than the one the certificate is for. The
        `evidenceHashCount` is a non-leaky integer (count only).

        Returns 404 — never 403 — for malformed, missing, or non-completed
        certificates (no existence leak).
      parameters:
        - in: path
          name: certId
          required: true
          schema:
            type: string
          description: UUID of the `user_progress` row for a completed project
      responses:
        "200":
          description: Certificate is valid and verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifiedCert"
        "404":
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/portfolio:
    get:
      operationId: getUserPortfolio
      tags: [user-projects]
      summary: Authenticated learner portfolio (Phase 29)
      description: |
        Phase 29 — Authenticated learner-facing portfolio. Returns one
        `PortfolioEvidence` row per completed project owned by the
        requesting user, enriched with the Phase 26/27 trustworthy
        completion evidence (passed-step count, evidence-hash count,
        project-scoped XP ledger rollup, first-step → completed span)
        using the same SQL fragments and clamps as the public Phase 28
        `/verify/:certId` route.

        Privacy contract: `userId` is sourced EXCLUSIVELY from the
        authenticated session. No path/query/body parameter accepts a
        userId, username, or project-ownership claim. Response never
        contains `email`, `clerkId`, internal user IDs, Stripe
        identifiers, raw submissions, raw evidence hashes, or any
        data scoped to a different user or project. Hidden
        (`learner_visible=false`) and soft-deleted projects are
        silently dropped — same anti-leak posture as `/dashboard`.
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Portfolio payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPortfolioResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/projects/{projectSlug}/portfolio-artifact:
    get:
      operationId: getPortfolioArtifact
      tags: [user-projects]
      summary: Authenticated portfolio artifact bundle (Phase 60C)
      description: |
        Phase 60A/60B/60C — Authenticated, read-only. Returns a deterministic,
        recruiter-readable artifact bundle (README.md, VALIDATION_EVIDENCE.md,
        LIMITATIONS.md, LEARNER_REFLECTION_TEMPLATE.md, and optionally
        DATASET_NOTES.md) generated from THIS user's safe completion and
        evidence records for the given project.

        Privacy contract: `userId` is sourced EXCLUSIVELY from the
        authenticated session — no path/query/body parameter accepts a userId
        or ownership claim. The response NEVER contains validationConfig,
        expectedRows, expectedRowsHash, reference solution queries, comparator
        internals, raw submissions, secrets, or over-claiming
        authorship/job-guarantee/certification copy (guaranteed by the
        assembly chokepoint, the leak-free-by-construction generator input
        model, and a runtime honest-claim guard).

        Returns 404 — never 403 — when the project is hidden, soft-deleted,
        unknown, or the user is not enrolled (no hidden-project existence leak).
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: projectSlug
          required: true
          schema:
            type: string
          description: Slug of a project the authenticated user is enrolled in
      responses:
        "200":
          description: Portfolio artifact bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioArtifactResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [user-projects]
      summary: Mark learner onboarding complete (Phase 21)
      description: |
        Idempotent — flips `users.onboarding_completed=true` on first call;
        subsequent calls are no-ops and return the same payload.
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Onboarding state after the call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    VerifiedCert:
      type: object
      description: |
        Phase 28 — Public certificate verification payload. Strictly
        non-private; never contains email, clerkId, internal user IDs,
        Stripe identifiers, raw submissions, raw evidence hashes, or
        cross-project data.
      properties:
        certId:
          type: string
          description: UUID of the user_progress row for this completion
        recipientName:
          type: string
        recipientUsername:
          type: string
          nullable: true
        projectTitle:
          type: string
        projectSlug:
          type: string
        completedAt:
          type: string
          format: date-time
        firstStepCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Earliest passed step completion timestamp for this learner on
            this project. Null when no step-completion rows exist (legacy
            pre-Phase-26 completions).
        durationSeconds:
          type: integer
          nullable: true
          description: |
            completedAt − firstStepCompletedAt, in whole seconds. Null
            when firstStepCompletedAt is null. Clamped to ≥ 0.
        stepsCompleted:
          type: integer
          description: |
            Count of distinct passed steps for this learner on this
            project. Always ≤ totalSteps.
        totalSteps:
          type: integer
          description: Required step count from the project definition.
        evidenceHashCount:
          type: integer
          description: |
            Count of passed step rows whose submission_sha256 is
            non-null. Phase 26 evidence; legacy pre-P26 rows are null and
            do not count. Always ≤ stepsCompleted. Raw hash values are
            never exposed.
        totalXpEarned:
          type: integer
          description: |
            Sum of xp_transactions.amount for this learner scoped to this
            project (metadata.projectId match). Reflects the Phase 26 XP
            ledger; legacy pre-P26 awards (which were not ledger-written)
            contribute 0 here.
        issuer:
          type: string
      required:
        - certId
        - recipientName
        - recipientUsername
        - projectTitle
        - projectSlug
        - completedAt
        - firstStepCompletedAt
        - durationSeconds
        - stepsCompleted
        - totalSteps
        - evidenceHashCount
        - totalXpEarned
        - issuer

    PortfolioEvidence:
      type: object
      description: |
        Phase 29 — Single completed project for the authenticated learner.
        Reuses Phase 28 evidence semantics (same SQL aggregates, same
        clamps) but adds learner-facing fields (`course`, `difficulty`,
        `topRole`, `verifyUrl`, `printUrl`). Excludes the
        public-cert-only fields (`recipientName`, `recipientUsername`,
        `issuer`) since the surface is the learner's own.
      properties:
        certId:
          type: string
          description: UUID of the user_progress row — shareable via /verify/{certId}
        projectSlug:
          type: string
        projectTitle:
          type: string
        course:
          type: string
          description: Course slug from projects.course (no heuristics)
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        completedAt:
          type: string
          format: date-time
        firstStepCompletedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
          nullable: true
          description: completedAt − firstStepCompletedAt, clamped ≥ 0
        stepsCompleted:
          type: integer
          description: Always ≤ totalSteps
        totalSteps:
          type: integer
        evidenceHashCount:
          type: integer
          description: Count of passed rows with non-null submission_sha256. Raw hashes never exposed. Always ≤ stepsCompleted.
        totalXpEarned:
          type: integer
          description: Sum of project-scoped xp_transactions for this learner. Legacy pre-P26 rows contribute 0.
        verifyUrl:
          type: string
          description: Relative URL — /verify/{certId}
        printUrl:
          type: string
          description: Relative URL — /certificates/{projectSlug}/print
        topRole:
          type: string
          nullable: true
          description: First entry of project.jobOutcomes.roles, if any
      required:
        - certId
        - projectSlug
        - projectTitle
        - course
        - difficulty
        - completedAt
        - firstStepCompletedAt
        - durationSeconds
        - stepsCompleted
        - totalSteps
        - evidenceHashCount
        - totalXpEarned
        - verifyUrl
        - printUrl
        - topRole

    UserPortfolioResponse:
      type: object
      description: |
        Phase 29 — Authenticated portfolio payload. `userId` is intentionally
        absent — clients already know who they are. Summary aggregates are
        computed over `items[]` so any future hidden/deleted-project drop
        is reflected consistently.
      properties:
        completedCount:
          type: integer
          description: Length of items[] (post hidden/deleted drop)
        totalProjectXp:
          type: integer
          description: Sum over items[].totalXpEarned
        evidenceBackedCount:
          type: integer
          description: Count of items where evidenceHashCount ≥ 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioEvidence"
      required:
        - completedCount
        - totalProjectXp
        - evidenceBackedCount
        - items

    PortfolioArtifactResponse:
      type: object
      description: |
        Phase 60C — deterministic, leak-safe portfolio artifact bundle for a
        single completed/enrolled project of the authenticated user. `files`
        maps each artifact filename to its markdown contents. Contains only the
        Phase-60A generator output — never validationConfig, expectedRows,
        answer keys, reference queries, raw submissions, or secrets.
      properties:
        projectSlug:
          type: string
        generatedAt:
          type: string
          format: date-time
        files:
          type: object
          description: Map of artifact filename → markdown contents.
          properties:
            "README.md":
              type: string
            "VALIDATION_EVIDENCE.md":
              type: string
            "LIMITATIONS.md":
              type: string
            "LEARNER_REFLECTION_TEMPLATE.md":
              type: string
            "DATASET_NOTES.md":
              type: string
          required:
            - README.md
            - VALIDATION_EVIDENCE.md
            - LIMITATIONS.md
            - LEARNER_REFLECTION_TEMPLATE.md
      required:
        - projectSlug
        - generatedAt
        - files

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    WebhookResponse:
      type: object
      properties:
        received:
          type: boolean
      required:
        - received

    JoinWaitlistBody:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User email address
        domainInterest:
          type: string
          nullable: true
          description: Slug of the domain the user is interested in
      required:
        - email

    JoinWaitlistResponse:
      type: object
      properties:
        success:
          type: boolean
        alreadyOnWaitlist:
          type: boolean
        message:
          type: string
      required:
        - success
        - alreadyOnWaitlist
        - message

    Domain:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        color:
          type: string
        status:
          type: string
          enum: [active, coming_soon, waitlist]
        projectCount:
          type: integer
        enrolledCount:
          type: integer
      required:
        - id
        - slug
        - name
        - description
        - icon
        - color
        - status
        - projectCount
        - enrolledCount

    DomainDetail:
      allOf:
        - $ref: "#/components/schemas/Domain"
        - type: object
          properties:
            projects:
              type: array
              items:
                $ref: "#/components/schemas/ProjectSummary"

    Course:
      type: object
      description: One of the 9 Atlas courses. Source of truth = `projects.course`.
      properties:
        slug:
          type: string
          enum:
            - data-engineering
            - ai-engineer
            - mlops-engineer
            - data-scientist
            - analytics-engineer
            - applied-llm-engineer
            - cloud-data-engineer
            - python-libraries
            - sql
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        color:
          type: string
        status:
          type: string
          enum: [active, coming_soon]
          description: active = has ≥1 learner_visible project; coming_soon otherwise.
        projectCount:
          type: integer
          description: Number of learner-visible projects with this course.
        authoredCount:
          type: integer
          description: Number of learner-visible projects with course_source='authored'.
      required:
        - slug
        - name
        - description
        - icon
        - color
        - status
        - projectCount
        - authoredCount

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          properties:
            projects:
              type: array
              items:
                $ref: "#/components/schemas/ProjectSummary"
            startHere:
              nullable: true
              description: |
                Phase 18 — Rule-based recommended first project for this
                course. Computed from the unfiltered learner-visible set so
                the recommendation is stable across difficulty filtering.
                Null only if the course has zero visible projects.
              allOf:
                - $ref: "#/components/schemas/StartHereRecommendation"
          required:
            - projects

    StartHereRecommendation:
      type: object
      description: |
        Phase 18 — Start Here recommendation. `kind=start_here` when at
        least one beginner project exists in the course; otherwise
        `kind=most_approachable_available` and the frontend renders an
        honest fallback message (no beginner projects yet).
      properties:
        project:
          $ref: "#/components/schemas/ProjectSummary"
        kind:
          type: string
          enum: [start_here, most_approachable_available]
        reasonKey:
          type: string
          enum: [beginner_available, no_beginner_available]
        hasBeginner:
          type: boolean
      required:
        - project
        - kind
        - reasonKey
        - hasBeginner

    EnrollmentRequest:
      type: object
      properties:
        projectSlug:
          type: string
          minLength: 1
          description: Learner-visible project slug. Hidden/archived slugs return 404.
      required:
        - projectSlug

    EnrollmentResponse:
      type: object
      description: |
        Phase 21 — Slug-based enrollment response. `currentStepId` resolves
        the project's step at `currentStepNumber`; both are nullable when the
        project has no steps (defensive; should not happen for catalog rows).
      properties:
        projectId:
          type: string
        projectSlug:
          type: string
        currentStepNumber:
          type: integer
        currentStepId:
          type: string
          nullable: true
        created:
          type: boolean
          description: True if this call inserted a new row; false if an existing enrollment was returned.
      required:
        - projectId
        - projectSlug
        - currentStepNumber
        - created

    DashboardEnrollment:
      type: object
      description: |
        Phase 21 — One row of the learner's enrollment list (in-progress or
        completed). Always references a `learner_visible=true` project.
      properties:
        projectId:
          type: string
        projectSlug:
          type: string
        projectTitle:
          type: string
        shortDescription:
          type: string
        course:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced]
        status:
          type: string
          enum: [in_progress, completed]
        currentStep:
          type: integer
        totalSteps:
          type: integer
        completionPercent:
          type: integer
        startedAt:
          type: string
          format: date-time
          nullable: true
        lastUpdatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - projectId
        - projectSlug
        - projectTitle
        - shortDescription
        - course
        - difficulty
        - status
        - currentStep
        - totalSteps
        - completionPercent
        - lastUpdatedAt

    DashboardResume:
      type: object
      properties:
        projectId:
          type: string
        projectSlug:
          type: string
        projectTitle:
          type: string
        course:
          type: string
        currentStep:
          type: integer
        totalSteps:
          type: integer
        completionPercent:
          type: integer
        lastUpdatedAt:
          type: string
          format: date-time
      required:
        - projectId
        - projectSlug
        - projectTitle
        - course
        - currentStep
        - totalSteps
        - completionPercent
        - lastUpdatedAt

    DashboardRecommendation:
      type: object
      description: |
        Phase 21 — Onboarding-time Start Here suggestion for a fresh learner
        (zero enrollments). Returned only when `inProgress` and `completed`
        are both empty.
      properties:
        courseSlug:
          type: string
        startHere:
          $ref: "#/components/schemas/StartHereRecommendation"
      required:
        - courseSlug
        - startHere

    DashboardResponse:
      type: object
      properties:
        resume:
          allOf:
            - $ref: "#/components/schemas/DashboardResume"
          nullable: true
        inProgress:
          type: array
          items:
            $ref: "#/components/schemas/DashboardEnrollment"
        completed:
          type: array
          items:
            $ref: "#/components/schemas/DashboardEnrollment"
        recommendedStartHere:
          allOf:
            - $ref: "#/components/schemas/DashboardRecommendation"
          nullable: true
      required:
        - inProgress
        - completed

    OnboardingState:
      type: object
      description: |
        Phase 21 — Onboarding state for the 3-step flow. `lastSeenStep` is
        derived from `users.onboarding_completed` + whether the learner has
        any enrollments. The frontend uses this to resume mid-flow.
      properties:
        completed:
          type: boolean
        hasEnrollments:
          type: boolean
        lastSeenStep:
          type: string
          enum: [pick_course, pick_project, first_enroll]
          nullable: true
      required:
        - completed
        - hasEnrollments

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        difficulty:
          type: string
          enum: [beginner, intermediate, advanced, expert]
        tier:
          type: string
          enum: [free, pro]
        xpReward:
          type: integer
        estimatedHours:
          type: number
        stepCount:
          type: integer
        enrolledCount:
          type: integer
        completionRate:
          type: number
        tags:
          type: array
          items:
            type: string
        position:
          type: integer
        jobOutcomes:
          $ref: "#/components/schemas/JobOutcomes"
      required:
        - id
        - slug
        - title
        - description
        - difficulty
        - tier
        - xpReward
        - estimatedHours
        - stepCount
        - enrolledCount
        - completionRate
        - tags
        - position

    PaginatedProjects:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
      required:
        - data
        - total
        - page
        - limit
        - hasMore

    ProjectStep:
      type: object
      properties:
        id:
          type: string
        position:
          type: integer
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [code_python, code_sql, multiple_choice, true_false, short_answer, file_upload, diagram, concept_check, reflection]
        starterCode:
          type: string
        expectedOutput:
          type: string
        hints:
          type: array
          items:
            type: string
        xpReward:
          type: integer
        isLocked:
          type: boolean
        expectedOutputs:
          type: object
          description: |
            Phase 2: generic expected outputs used by validateExpected in
            @workspace/execution-core. Free-form JSONB; shape is constrained
            client-side by expectedOutputsSchema (rows, stdout, files, metrics).
          additionalProperties: true
          nullable: true
        datasetRefs:
          type: array
          description: Sample dataset names to register before running this step (e.g. SQL/DuckDB).
          items:
            type: string
          nullable: true
        executionOverride:
          $ref: "#/components/schemas/ExecutionProfile"
          nullable: true
        serverGrade:
          type: boolean
          description: |
            Phase 57B — when true the server commit-grader evaluates this step's
            submission for real (the csv_set_equal staged-hybrid opt-in). When
            false the step's server grading stays backward-compatible (auto-pass
            / legacy). For an opted-in SQL step the client submits a canonical
            {columns, rows} JSON capture of the learner's run.
      required:
        - id
        - position
        - title
        - description
        - type
        - xpReward
        - isLocked

    ExecutionProfile:
      type: object
      description: |
        How a project's code is actually executed. Validated client-side by
        executionProfileSchema in @workspace/execution-core.
      properties:
        mode:
          type: string
          enum: [simulated, replay, local_container, byo_cloud, managed_sandbox]
        honestyLabel:
          type: string
        supportedPlatforms:
          type: array
          items:
            type: string
        requiredServices:
          type: array
          items:
            type: string
        estimatedCost:
          type: string
        cleanupSteps:
          type: array
          items:
            type: string
      required:
        - mode
        - honestyLabel

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          properties:
            longDescription:
              type: string
            learningObjectives:
              type: array
              items:
                type: string
            prerequisites:
              type: array
              items:
                type: string
            steps:
              type: array
              items:
                $ref: "#/components/schemas/ProjectStep"
            domainSlug:
              type: string
              description: INTERNAL — legacy domain slug. Learner UI should prefer `courseSlug`.
            domainName:
              type: string
              description: INTERNAL — legacy domain title. Learner UI should prefer `courseName`.
            courseSlug:
              type: string
              enum:
                - data-engineering
                - ai-engineer
                - mlops-engineer
                - data-scientist
                - analytics-engineer
                - applied-llm-engineer
                - cloud-data-engineer
                - python-libraries
                - sql
              description: Learner-facing Atlas course this project belongs to (`projects.course`).
            courseName:
              type: string
              description: Display name for `courseSlug`.
            jobOutcomes:
              $ref: "#/components/schemas/JobOutcomes"
            executionProfile:
              $ref: "#/components/schemas/ExecutionProfile"
              nullable: true

    JobOutcomes:
      type: object
      description: Career-readiness signals demonstrated by completing this project.
      properties:
        roles:
          type: array
          description: Real-world job titles this project maps to.
          items:
            type: string
        skillsForResume:
          type: array
          description: Concrete skills suitable for a Skills section on a resume.
          items:
            type: string
        resumeBullets:
          type: array
          description: Action-oriented resume bullet points based on the project work.
          items:
            type: string
        interviewQuestions:
          type: array
          description: Common interview questions this project prepares the learner to answer.
          items:
            type: string
        portfolioReadiness:
          type: string
          description: Short paragraph explaining how this project becomes a portfolio piece.
        marketSignal:
          type: string
          description: Why this skill matters in the 2026+ data engineering job market.
      required:
        - roles
        - skillsForResume
        - resumeBullets
        - interviewQuestions

    UserProject:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, completed, abandoned]
        currentStepPosition:
          type: integer
        earnedXp:
          type: integer
        completedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - userId
        - status
        - currentStepPosition
        - earnedXp

    UserProjectSummary:
      allOf:
        - $ref: "#/components/schemas/UserProject"
        - type: object
          properties:
            project:
              $ref: "#/components/schemas/ProjectSummary"

    UserProjectProgress:
      allOf:
        - $ref: "#/components/schemas/UserProject"
        - type: object
          properties:
            project:
              $ref: "#/components/schemas/ProjectDetail"
            stepCompletions:
              type: array
              items:
                $ref: "#/components/schemas/StepCompletion"
            progressPercent:
              type: number

    StepCompletion:
      type: object
      properties:
        id:
          type: string
        stepId:
          type: string
        userProjectId:
          type: string
        status:
          type: string
          enum: [pending, passed, failed, skipped]
        attempt:
          type: integer
        submission:
          type: string
        feedback:
          type: string
        xpEarned:
          type: integer
        completedAt:
          type: string
          format: date-time
      required:
        - id
        - stepId
        - userProjectId
        - status
        - attempt

    SubmitStepBody:
      type: object
      properties:
        submission:
          type: string
          description: Code, answer, or other submission content
        submissionType:
          type: string
          enum: [code, text, choice, file]
        envelope:
          $ref: "#/components/schemas/SignedRunEnvelope"
          nullable: true
          description: |
            Phase 49 — Optional signed RunResult envelope (minted by
            POST /runs/sign right after a successful local Run). When present
            AND the step's validation kind is enabled in the pilot allow-list
            (ATLAS_ENVELOPE_REQUIRED_KINDS), /submit grades against the
            verified capture rather than the bare submission string. Absence
            preserves legacy bare-string grading semantics for backward
            compatibility — older clients keep working unchanged.
      required:
        - submission
        - submissionType

    RunCapture:
      type: object
      description: |
        Phase 45 — Runtime execution capture produced by the in-browser
        Pyodide / DuckDB adapters. Sent to POST /runs/sign to be wrapped
        in a server-signed envelope. Honest-claim ceiling H3: the signature
        proves Atlas issued the envelope; it does NOT prove the capture
        came from honest learner execution.
      properties:
        version:
          type: integer
          enum: [1]
        language:
          type: string
          enum: [python, sql]
        code:
          type: string
          description: Source the client claims to have executed.
        stdout: { type: string }
        stderr: { type: string }
        exitCode: { type: integer }
        durationMs: { type: integer }
        timedOut: { type: boolean }
        columns:
          type: array
          items: { type: string }
          description: |
            Tabular columns (DuckDB-style adapters). OMIT (do not send `null`)
            for stdout-only runs — the server rejects `null` here.
        rows:
          type: array
          items:
            type: array
            items:
              # JSON union — Orval emits `string | number | boolean | null`.
              nullable: true
              oneOf:
                - type: string
                - type: number
                - type: boolean
          description: |
            Tabular rows aligned to `columns`. OMIT (do not send `null`)
            for stdout-only runs.
      required:
        - version
        - language
        - code
        - stdout
        - stderr
        - exitCode
        - durationMs
        - timedOut

    EnvelopeBinding:
      type: object
      description: |
        Phase 45 — Server-issued binding inside a SignedRunEnvelope. Every
        field is verified at /submit time. `kid` supports future signing-key
        rotation without invalidating in-flight envelopes.
      properties:
        version: { type: integer, enum: [1] }
        kid: { type: string }
        userId: { type: string }
        projectId: { type: string }
        stepId: { type: string }
        validationKind: { type: string }
        submissionSha256:
          type: string
          description: sha256(capture.code), hex lowercase. Derived server-side at sign time.
        outputSha256:
          type: string
          description: sha256(canonicalized capture output fields), hex lowercase. Audit/forensic aid.
        issuedAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, server clock at signing.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 UTC, issuedAt + ttlMs (10 minutes).
        nonce:
          type: string
          description: Single-use replay token within the TTL window.
      required:
        - version
        - kid
        - userId
        - projectId
        - stepId
        - validationKind
        - submissionSha256
        - outputSha256
        - issuedAt
        - expiresAt
        - nonce

    SignedRunEnvelope:
      type: object
      description: |
        Phase 45 — Server-signed RunResult envelope. Returned by
        POST /runs/sign and optionally attached to POST /submit.
      properties:
        capture: { $ref: "#/components/schemas/RunCapture" }
        binding: { $ref: "#/components/schemas/EnvelopeBinding" }
        signature:
          type: string
          description: |
            HMAC-SHA256 over canonical(capture)||"\n"||canonical(binding),
            hex lowercase. Verified at /submit time.
      required:
        - capture
        - binding
        - signature

    SignRunBody:
      type: object
      properties:
        projectId: { type: string }
        stepId: { type: string }
        capture: { $ref: "#/components/schemas/RunCapture" }
      required:
        - projectId
        - stepId
        - capture

    SignRunResponse:
      type: object
      properties:
        envelope: { $ref: "#/components/schemas/SignedRunEnvelope" }
      required:
        - envelope

